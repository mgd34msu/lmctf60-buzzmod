//===========================================================================
// BSPC configuration for LMCTF BuzzMod.
//
// bspc's built-in defaults set the player bounding boxes and a handful of
// physics constants and leave every reachability cost at zero. Compiling with
// those defaults produces navigation data where a ledge that causes fall
// damage looks as cheap as a staircase, and a crouch crawl looks as cheap as
// walking -- the routing has no reason to prefer the sensible way round.
//
// The costs below are id's, from the Quake III bspc configuration. The physics
// are Quake II's, and they match the values be_interface_q2.c feeds the
// library at runtime: if the two disagree, routes are compiled against one set
// of movement rules and walked with another.
//===========================================================================

#define PRESENCE_NONE               1
#define PRESENCE_NORMAL             2
#define PRESENCE_CROUCH             4

bbox    //30x30x56 -- Quake II's standing player
{
    presencetype    PRESENCE_NORMAL
    flags           0x0000
    mins            {-15, -15, -24}
    maxs            {15, 15, 32}
} //end bbox

bbox    //30x30x40 -- crouched
{
    presencetype    PRESENCE_CROUCH
    flags           0x0001
    mins            {-15, -15, -24}
    maxs            {15, 15, 16}
} //end bbox

settings
{
    phys_gravitydirection       {0, 0, -1}
    phys_friction               6
    phys_stopspeed              100
    phys_gravity                800
    phys_waterfriction          1
    phys_watergravity           100
    phys_maxvelocity            300
    phys_maxwalkvelocity        300
    phys_maxcrouchvelocity      100
    phys_maxswimvelocity        400
    phys_airaccelerate          0
    phys_maxstep                18
    phys_maxsteepness           0.7
    phys_maxwaterjump           19
    phys_maxbarrier             32
    phys_jumpvel                270
    phys_falldelta5             40
    phys_falldelta10            60

    rs_waterjump                400
    rs_teleport                 50
    rs_barrierjump              100
    rs_startcrouch              300

    // Quake III charges 500 to start a grapple: there it is a weapon you have
    // to find, select and hold, so it is a last resort. In LMCTF the hook is
    // offhand, always in hand, and faster than running -- players cross the
    // map on it constantly, and bots should too.
    //
    // Travel times here are hundredths of a second. Walking at 300 units/sec
    // costs about 0.33 per unit; a grapple costs 0.25 per unit plus this fixed
    // start cost. So the break-even distance is roughly rs_startgrapple/0.08:
    // at Quake III's 500 the hook never wins, at 120 it needs a 1500-unit haul,
    // and at 25 it wins beyond about 300 units -- a corridor's length, which is
    // where a player would reach for it.
    rs_startgrapple             25

    rs_startwalkoffledge        70
    rs_startjump                300
    rs_rocketjump               500
    rs_bfgjump                  500
    rs_jumppad                  250
    rs_aircontrolledjumppad     300
    rs_funcbob                  300
    rs_startelevator            50
    rs_falldamage5              300
    rs_falldamage10             500
    rs_maxjumpfallheight        450
} //end settings
