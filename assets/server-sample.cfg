// LMCTF BuzzMod v1.0.0 -- a sample server config.  exec it after your own.
set hostname "LMCTF BuzzMod"
set deathmatch 1
set maxclients 16
set timelimit 20
set capturelimit 10
set ctfflags 16                 // offhand hook
set sv_botfill 5                // fill each team to five SLIPGATE bots
set spawn_loadout "@start"
set loadout_start "rocketlauncher:5 grenades:5"
set ctf_hitsound 2              // hit and kill sounds for every event
set ctf_killsound 2
set sg_debug 0                  // 1 logs the bots' decisions to the server log
