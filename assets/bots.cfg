; LMCTF BuzzMod bot roster.
;
; Every field is a quoted string; the parser wants them that way:
;     "sv" "addbot" "<name>" "<skin>" "<charfile>" "<charname>"
;
; The character file supplies aim, reaction time, weapon preference and chat
; personality, picked by skill level from the bot_skill cvar (1-5).
; LMCTF assigns team skins itself, so the skin here is only a fallback.

"sv" "addbot" "Ranger" "male/grunt" "bots/default_c.c" "defaultbot"
