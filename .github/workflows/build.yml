name: build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    name: Buzzmod version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate semantic version
        id: version
        shell: bash
        run: |
          tag=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ -n "$tag" ]]; then
            version=$(tests/check_buzzmod_version.sh "$tag")
          else
            version=$(tests/check_buzzmod_version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Buzzmod v$version"

  linux:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # GNUmakefile derives VER from git rev-list

      - name: Build
        run: |
          make -f GNUmakefile 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Fail on warnings
        run: |
          if grep -q "warning:" build.log; then
            grep "warning:" build.log
            echo "::error::build produced warnings"
            exit 1
          fi
          echo "no warnings"

      # The engine loads the library by exact filename. The versioned name the
      # makefile produces is for telling builds apart and would be ignored.
      - name: Package
        run: |
          mkdir -p dist
          cp game*-lmctf-*.so dist/gamex86_64.so
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lmctf-buzzmod-linux-x86_64
          path: dist/gamex86_64.so

  verification:
    name: Host gates (${{ matrix.name }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GNUmakefile GCC
            build_file: GNUmakefile
            compiler: gcc
          - name: Makefile GCC
            build_file: Makefile
            compiler: gcc
          - name: GNUmakefile Clang
            build_file: GNUmakefile
            compiler: clang
          - name: Makefile Clang
            build_file: Makefile
            compiler: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install sheet test runtime
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/slipgate-film"
          "$RUNNER_TEMP/slipgate-film/bin/pip" install -r tools/requirements.txt

      - name: Build module and run complete host suite
        shell: bash
        run: |
          set -o pipefail
          FILM_PYTHON="$RUNNER_TEMP/slipgate-film/bin/python" \
            make -B -f "${{ matrix.build_file }}" -j2 \
            CC="${{ matrix.compiler }}" all host-test 2>&1 | tee host-test.log
          module=$(find . -maxdepth 1 -type f -name 'game*-lmctf-*.so' \
            -print -quit)
          test -n "$module"
          ldd -r "$module" 2>&1 | tee module-relocations.log

      - name: Fail on warnings
        shell: bash
        run: |
          if grep -q "warning:" host-test.log; then
            grep "warning:" host-test.log
            echo "::error::host verification produced warnings"
            exit 1
          fi
          echo "no warnings"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            output: gamex86_64.dll
          - arch: x86
            platform: Win32
            output: gamex86.dll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # The project's pre-build step calls TortoiseGit's GitWCRev, which is not
      # on a runner. Same substitutions, done with plain git.
      - name: Generate GitRevisionInfo.h
        shell: bash
        run: |
          REV=$(git rev-list HEAD | wc -l)
          SHA=$(git rev-parse --short HEAD)
          sed -e 's/\$//g' GitRevisionInfo.tmpl \
            | sed -e "s/WCLOGCOUNT+2/${REV}/g" \
            | sed -e "s/WCREV=7/${SHA}/g" \
            | sed -e "s/WCNOW=%Y/$(date +%Y)/g" > GitRevisionInfo.h
          cat GitRevisionInfo.h

      # gravity.vcxproj sends output to $(Q2DIR)\lmctf\ so a local build lands
      # straight in the game directory. Q2DIR does not exist here, so point
      # OutDir somewhere known rather than editing the project.
      # PreBuildEventUseInBuild=false skips the project's pre-build step, which
      # shells out to GitWCRev.exe and fails with 9009 on a runner. The header it
      # would have written was already generated above.
      # PowerShell, not bash: setup-msbuild only puts msbuild on the PATH the
      # Windows shells see. Output is teed rather than using /flp, whose
      # semicolon PowerShell would treat as a command separator.
      - name: Build
        run: |
          msbuild gravity.sln `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:OutDir=${{ github.workspace }}/build/${{ matrix.arch }}/ `
            /p:PreBuildEventUseInBuild=false `
            /m 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Same gate the Linux job has. sqlite3.c is vendored and built with
      # warnings off, so anything left here is ours.
      - name: Fail on warnings
        shell: bash
        run: |
          if grep -qE "warning [A-Z]+[0-9]+" build.log; then
            grep -oE "warning [A-Z]+[0-9]+.*" build.log | sort -u
            echo "::error::build produced warnings"
            exit 1
          fi
          echo "no warnings"

      # TargetName in the project is already gamex86 / gamex86_64, which is what
      # the engine looks for, so there is nothing to rename.
      - name: Package
        shell: bash
        run: |
          src="build/${{ matrix.arch }}/${{ matrix.output }}"
          if [ ! -f "$src" ]; then
            echo "::error::expected $src"
            find build -type f -print
            exit 1
          fi
          mkdir -p dist
          cp "$src" dist/
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lmctf-buzzmod-windows-${{ matrix.arch }}
          path: dist/${{ matrix.output }}

  release:
    name: Publish release
    needs: [ version, linux, verification, windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Assemble
        run: |
          mkdir -p release
          cp artifacts/lmctf-buzzmod-linux-x86_64/gamex86_64.so release/
          cp artifacts/lmctf-buzzmod-windows-x64/gamex86_64.dll  release/
          cp artifacts/lmctf-buzzmod-windows-x86/gamex86.dll     release/
          cp assets/lmctf6-buzzmod.pak                           release/
          printf '%s\n' "${{ needs.version.outputs.version }}" > release/VERSION
          # SLIPGATE bots are compiled into the game modules; no separate
          # bot library or data download exists anymore (runes are generated
          # server-side with `sv rune`).
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release/*
          body_path: RELEASES.md
          draft: false
          name: Buzzmod ${{ github.ref_name }}
