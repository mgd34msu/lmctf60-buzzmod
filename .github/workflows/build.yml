name: build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
  pull_request:

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: BuzzmodVersion.h is semantic, and matches a release tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version=$(tests/check_buzzmod_version.sh "${GITHUB_REF_NAME}")
          else
            version=$(tests/check_buzzmod_version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x86_64 (${{ matrix.cc }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build the module and run the tests
        shell: bash
        run: |
          set -o pipefail
          make -B -j2 CC=${{ matrix.cc }} all 2>&1 | tee build.log
          make CC=${{ matrix.cc }} check 2>&1 | tee test.log
          module="$(make -s runtime-module-path)"
          test -f "$module"
          echo "MODULE=$module" >> "$GITHUB_ENV"
      - name: No warnings
        shell: bash
        run: |
          if grep -q "warning:" build.log; then grep "warning:" build.log; echo "::error::the build produced warnings"; exit 1; fi
      - name: Package
        if: matrix.cc == 'gcc'
        shell: bash
        run: |
          mkdir -p dist && cp -- "$MODULE" dist/gamex86_64.so && ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.cc == 'gcc'
        with:
          name: lmctf-buzzmod-linux-x86_64
          path: dist/gamex86_64.so

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            output: gamex86_64.dll
          - arch: x86
            platform: Win32
            output: gamex86.dll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      # The project's pre-build step calls TortoiseGit's GitWCRev, which a
      # runner does not have.  Same substitutions with plain git.
      - name: Generate GitRevisionInfo.h
        shell: bash
        run: |
          REV=$(git rev-list HEAD | wc -l)
          SHA=$(git rev-parse --short HEAD)
          sed -e 's/\$//g' GitRevisionInfo.tmpl \
            | sed -e "s/WCLOGCOUNT+2/${REV}/g" \
            | sed -e "s/WCREV=7/${SHA}/g" \
            | sed -e "s/WCNOW=%Y/$(date +%Y)/g" > GitRevisionInfo.h
      - name: Build
        shell: pwsh
        run: |
          msbuild gravity.vcxproj /m /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:OutDir=${{ github.workspace }}/build/${{ matrix.arch }}/ `
            /p:PreBuildEventUseInBuild=false /p:PostBuildEventUseInBuild=false 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: No warnings
        shell: bash
        run: |
          if grep -q "warning C" build.log; then grep "warning C" build.log; echo "::error::the build produced warnings"; exit 1; fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          src=$(ls build/${{ matrix.arch }}/*.dll | head -1)
          test -f "$src" && cp -- "$src" "dist/${{ matrix.output }}" && ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lmctf-buzzmod-windows-${{ matrix.arch }}
          path: dist/${{ matrix.output }}

  release:
    name: Publish the release
    needs: [ version, linux, windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d8d80b3c6fa6c4f78f3fc42a4dd9e8d8c1ff6e5f # v7.0.1
        with:
          path: artifacts
      - name: Assemble the full mod
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          r="lmctf-buzzmod-v$v"; mkdir -p "$r/maps"
          cp artifacts/lmctf-buzzmod-linux-x86_64/gamex86_64.so "$r/"
          cp artifacts/lmctf-buzzmod-windows-x64/gamex86_64.dll "$r/"
          cp artifacts/lmctf-buzzmod-windows-x86/gamex86.dll    "$r/"
          cp assets/lmctf6-buzzmod.pak                          "$r/"
          cp assets/server-sample.cfg                           "$r/"
          cp data/bites/*.bites                                 "$r/maps/"
          notes="docs/RELEASE-v$v.md"; test -f "$notes" || notes="CHANGELOG.md"
          cp "$notes" "$r/README.md"
          printf '%s\n' "$v" > "$r/VERSION"
          (cd "$r" && sha256sum gamex86_64.so gamex86_64.dll gamex86.dll lmctf6-buzzmod.pak > SHA256SUMS && cat SHA256SUMS)
          zip -qr "$r.zip" "$r"
          mkdir -p release && cp "$r.zip" "$r"/gamex86_64.so "$r"/gamex86_64.dll "$r"/gamex86.dll "$r"/lmctf6-buzzmod.pak "$r"/SHA256SUMS release/
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - name: Publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release/*
          name: LMCTF BuzzMod ${{ github.ref_name }}
          body_path: ${{ env.NOTES }}
